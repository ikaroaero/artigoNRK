<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel de resultados NRK</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#edf2f6;color:#17212b;font-family:system-ui,sans-serif}
    header{padding:20px 26px;background:#17324d;color:#fff}header h1{margin:0 0 4px;font-size:1.5rem}header p{margin:0;opacity:.82}
    main{max-width:1500px;margin:18px auto;padding:0 18px}.controles{display:flex;flex-wrap:wrap;gap:14px;align-items:end;padding:15px;background:#fff;border-radius:10px;box-shadow:0 2px 10px #0001}
    label{display:grid;gap:5px;font-weight:650}select,button{min-width:150px;padding:9px 11px;border:1px solid #b8c2cc;border-radius:6px;background:#fff;font-size:1rem}button{min-width:auto;cursor:pointer}button:hover{background:#e7eef5}
    .galeria{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:16px;margin-top:16px}.cartao{padding:13px;background:#fff;border-radius:10px;box-shadow:0 2px 10px #0001;text-align:center}.cartao h2{margin:3px 0 12px;font-size:1.05rem}.cartao img{display:block;width:100%;height:auto;margin:auto}.acoes{display:flex;justify-content:center;gap:14px;margin-top:10px}.acoes a{color:#135b96}.vazio{grid-column:1/-1;padding:60px 20px;text-align:center;color:#607080;background:#fff;border-radius:10px}.erro{padding:36px 10px;color:#9b2c2c}
    @media(max-width:530px){.galeria{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><h1>Painel de resultados NRK</h1><p>Explore e compare as análises ecológicas.</p></header>
  <main>
    <section class="controles">
      <label>Tipo<select id="tipo"><option value="individual">Espécies × tempo — individual</option><option value="media">Espécies × tempo — média</option><option value="pop_nrk_individual">População × NRK — individual</option><option value="pop_nrk_media">População × NRK — média</option><option value="sar">SAR</option><option value="sad">SAD — modelo</option><option value="sad_conjunta">SAD — conjunta</option><option value="sad_lognormal">SAD — lognormal por NRK</option><option value="sad_7_bins">SAD — 7 bins</option><option value="whittaker_classico">Whittaker — clássico</option><option value="whittaker_shift">Whittaker — shift</option><option value="whittaker_50_bins">Whittaker — 50 bins</option><option value="whittaker_histograma">Whittaker — histograma</option></select></label>
      <label data-ciclo>Ciclo<select id="ciclo"></select></label>
      <label>h<select id="h"></select></label>
      <label data-nrk>NRK<select id="nrk"></select></label>
      <button id="adicionar" type="button">+ Adicionar à comparação</button><button id="limpar" type="button">Limpar comparação</button>
    </section>
    <section id="galeria" class="galeria"><div class="vazio">Escolha os parâmetros e adicione uma figura.</div></section>
  </main>
  <script>
    const $=s=>document.querySelector(s), tipo=$('#tipo'), ciclo=$('#ciclo'), h=$('#h'), nrk=$('#nrk'), galeria=$('#galeria');
    const preencher=(el,valores)=>el.replaceChildren(...valores.map(v=>new Option(v,v)));
    preencher(ciclo,['ciclo_001','ciclo_002','ciclo_003','ciclo_004','ciclo_005','ciclo_006']); preencher(h,['0.01','0.50','0.99']); preencher(nrk,['3','5','10','25','50','75']);
    function atualizar(){
      const usaCiclo=['individual','pop_nrk_individual'].includes(tipo.value), usaNrk=['individual','sad_lognormal'].includes(tipo.value);
      document.querySelectorAll('[data-ciclo]').forEach(el=>el.hidden=!usaCiclo); document.querySelectorAll('[data-nrk]').forEach(el=>el.hidden=!usaNrk);
      h.closest('label').hidden=['pop_nrk_individual','pop_nrk_media'].includes(tipo.value);
    }
    function item(){
      const H=h.value;
      if(tipo.value==='individual')return{titulo:`Individual — ${ciclo.value} — h${H} — NRK=${nrk.value}`,arquivo:`INDIVIDUAIS/${ciclo.value}/W4.0/h${H}/NRK=${nrk.value}/Esp_t.png`};
      if(tipo.value==='media')return{titulo:`Média — h${H}`,arquivo:`MEDIAS/W4.0_h${H}_MEDIA.png`};
      if(tipo.value==='pop_nrk_individual')return{titulo:`População × NRK — ${ciclo.value}`,arquivo:`POP_X_NRK/INDIVIDUAIS/${ciclo.value}/populacao_x_NRK_W4.png`};
      if(tipo.value==='pop_nrk_media')return{titulo:'População × NRK — média',arquivo:'POP_X_NRK/MEDIAS/populacao_x_NRK_W4_MEDIA.png'};
      if(tipo.value==='sar')return{titulo:`SAR — h${H}`,arquivo:`SAR/W4.0_h${H}_SAR_MODELO.png`};
      if(tipo.value==='sad')return{titulo:`SAD — modelo — h${H}`,arquivo:`SAD/W4.0_h${H}_SAD_MODELO.png`};
      if(tipo.value==='sad_conjunta')return{titulo:`SAD — conjunta — h${H}`,arquivo:`SAD/W4.0_h${H}_SAD_CONJUNTA.png`};
      if(tipo.value==='sad_lognormal')return{titulo:`SAD — lognormal — h${H} — NRK=${nrk.value}`,arquivo:`SAD/W4.0_h${H}_NRK${nrk.value}_SAD_LOGNORMAL.png`};
      if(tipo.value==='sad_7_bins')return{titulo:`SAD — 7 bins — h${H}`,arquivo:`SAD_7_bins/W4.0_h${H}_SAD_7_BINS_SHIFT.png`};
      if(tipo.value==='whittaker_classico')return{titulo:`Whittaker — clássico — h${H}`,arquivo:`Whittaker/W4.0_h${H}_WHITTAKER_CLASSICO.png`};
      if(tipo.value==='whittaker_shift')return{titulo:`Whittaker — shift — h${H}`,arquivo:`Whittaker/W4.0_h${H}_WHITTAKER_SHIFT.png`};
      if(tipo.value==='whittaker_50_bins')return{titulo:`Whittaker — 50 bins — h${H}`,arquivo:`Whittaker/W4.0_h${H}_WHITTAKER_50_BINS.png`};
      return{titulo:`Whittaker — histograma — h${H}`,arquivo:`Whittaker/W4.0_h${H}_WHITTAKER_50_BINS_HISTOGRAMA.png`};
    }
    function vazio(){if(!galeria.querySelector('.cartao'))galeria.innerHTML='<div class="vazio">Escolha os parâmetros e adicione uma figura.</div>'}
    function adicionar(){const x=item();galeria.querySelector('.vazio')?.remove();if(galeria.querySelector(`[data-arquivo="${x.arquivo}"]`))return;const card=document.createElement('article');card.className='cartao';card.dataset.arquivo=x.arquivo;const titulo=document.createElement('h2');titulo.textContent=x.titulo;const img=document.createElement('img');img.src=x.arquivo;img.alt=x.titulo;img.loading='lazy';img.onerror=()=>{img.replaceWith(Object.assign(document.createElement('div'),{className:'erro',textContent:'Figura não disponível para esta combinação.'}))};const acoes=document.createElement('div');acoes.className='acoes';const abrir=document.createElement('a');abrir.href=x.arquivo;abrir.target='_blank';abrir.textContent='Abrir separadamente';const remover=document.createElement('button');remover.type='button';remover.textContent='Remover';remover.onclick=()=>{card.remove();vazio()};acoes.append(abrir,remover);card.append(titulo,img,acoes);galeria.append(card)}
    tipo.onchange=atualizar;$('#adicionar').onclick=adicionar;$('#limpar').onclick=()=>{galeria.replaceChildren();vazio()};atualizar();
  </script>
</body>
</html>
